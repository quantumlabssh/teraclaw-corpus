setup:
  # The verifier runs each command as argv, not through a shell, so `&&` and
  # shell redirection are not available. Split the venv creation from the
  # install instead of chaining them.
  - name: create venv
    command: uv venv .venv
    timeout_s: 300
  - name: install
    command: uv pip install --python .venv/bin/python -e . pytest freezegun
    timeout_s: 600
checks:
  - type: command
    name: pytest
    command: .venv/bin/python -m pytest -q
    timeout_s: 600
