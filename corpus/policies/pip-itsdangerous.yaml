setup:
  - name: setup venv
    # Use uv rather than `python -m venv`: the hosted image has Python but not
    # always ensurepip/python3-venv, and this entry only needs the venv as an
    # install target.
    command: uv venv .venv && uv pip install --python .venv/bin/python -e . pytest freezegun
    timeout_s: 600
checks:
  - type: command
    name: pytest
    command: .venv/bin/python -m pytest -q
    timeout_s: 600
